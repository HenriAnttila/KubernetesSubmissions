apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: log-output-volume
          emptyDir: {}
      containers:
        - name: log-output-reader
          image: log-output-reader:1.0
          env:
          - name: LOG_DIR
            value: /app/files
          volumeMounts:
          - name: log-output-volume
            mountPath: /app/files
        - name: log-output-writer
          image: log-output-writer:1.0
          env:
          - name: LOG_DIR
            value: /app/files
          volumeMounts:
          - name: log-output-volume
            mountPath: /app/files

