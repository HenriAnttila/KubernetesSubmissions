apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      volumes:
        - name: shared-volume
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: ping-pong
          image: ping-pong:1.2
          env:
          - name: SHARED_DIR
            value: /app/shared
          volumeMounts:
          - name: shared-volume
            mountPath: /app/shared
