apiVersion: apps/v1
kind: Deployment
metadata:
  name: ping-pong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ping-pong
  template:
    metadata:
      labels:
        app: ping-pong
    spec:
      containers:
        - name: ping-pong
          image: ping-pong:1.4
          env:
          - name: PGHOST
            value: postgres-svc
          - name: PGUSER
            value: postgres
          - name: PGPASSWORD
            value: postgres # plaintext bad i know
          - name: PGDATABASE
            value: postgres
