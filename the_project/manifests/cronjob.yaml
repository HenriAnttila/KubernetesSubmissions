apiVersion: batch/v1
kind: CronJob
metadata:
  name: wiki-todo
  namespace: project
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: wiki-todo
              image: curlimages/curl:8.11.1
              env:
              - name: TODO_BACKEND_URL
                value: http://todo-backend-svc:2345
              command:
                - sh
                - -c
                - |
                  URL=$(curl -s -o /dev/null -w '%{redirect_url}' https://en.wikipedia.org/wiki/Special:Random)
                  echo "Read $URL"
                  curl -s -X POST -H 'Content-Type: application/json' -d "{\"todo\": \"Read $URL\"}" $TODO_BACKEND_URL/todos
