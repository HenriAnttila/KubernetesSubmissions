apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-volume
          persistentVolumeClaim:
            claimName: todo-app-claim
      containers:
        - name: todo-app
          image: todo-app:1.7
          env:
          - name: IMAGE_DIR
            value: /app/images
          - name: TODO_BACKEND_URL
            value: http://todo-backend-svc:2345
          volumeMounts:
          - name: image-volume
            mountPath: /app/images
